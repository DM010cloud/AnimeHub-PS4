
name: Build AnimeHub

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out AnimeHub
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make tar clang lld libicu-dev python3-pil curl

      - name: Install libssl1.1
        run: |
          base="https://security.ubuntu.com/ubuntu/pool/main/o/openssl/"
          ver="$(curl -fsSL "$base" | grep -oE 'libssl1\.1_1\.1\.1f-[0-9a-z.~+]+_amd64\.deb' | sed -E 's/^libssl1\.1_(.*)_amd64\.deb$/\1/' | sort -V | tail -1)"
          if [ -z "$ver" ]; then
            echo "Could not find libssl1.1"
            exit 1
          fi
          curl -fsSL "${base}libssl1.1_${ver}_amd64.deb" -o libssl1.1.deb
          sudo dpkg -i libssl1.1.deb

      - name: Download OpenOrbis toolchain
        run: |
          curl -L "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz" -o toolchain.tar.gz
          echo "3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  toolchain.tar.gz" | sha256sum -c
          mkdir toolchain
          tar -xzf toolchain.tar.gz -C toolchain

      - name: Locate toolchain
        run: |
          TOOLCHAIN_DIR="$(find "$GITHUB_WORKSPACE/toolchain" -name link.x -printf '%h\n' | head -n 1)"
          if [ -z "$TOOLCHAIN_DIR" ]; then
            echo "Could not find the OpenOrbis toolchain"
            exit 1
          fi
          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN_DIR" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_DIR/bin/linux" >> "$GITHUB_PATH"

      - name: Create AnimeHub icon
        run: |
          mkdir -p sce_sys
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont

          image = Image.new("RGB", (512, 512), (22, 15, 48))
          draw = ImageDraw.Draw(image)
          draw.rounded_rectangle((35, 35, 477, 477), radius=75, fill=(66, 35, 115))
          draw.ellipse((166, 85, 346, 265), fill=(245, 245, 255))
          draw.polygon([(225, 130), (225, 220), (300, 175)], fill=(66, 35, 115))
          font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 43)
          draw.text((256, 350), "ANIMEHUB", anchor="mm", font=font, fill="white")
          image.save("sce_sys/icon0.png")
          PY

      - name: Build AnimeHub package
        run: |
          make clean
          make

      - name: Upload AnimeHub package
        uses: actions/upload-artifact@v4
        with:
          name: AnimeHub-package
          path: |
            *.pkg
            eboot.bin
